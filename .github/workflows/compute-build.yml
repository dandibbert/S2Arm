name: Compute shader validation build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    if: github.repository_owner == 'dandibbert'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build graphics/tools/direct/tests/dsh_cmp/dsh_cmp.csproj -c Release -o build/compute-test -p:UseSharedCompilation=false
      - run: dotnet build graphics/tools/direct/dsh/batch/dsh_batch.csproj -c Release -o build/compute-batch -p:UseSharedCompilation=false
      - uses: actions/upload-artifact@v4
        with:
          name: compute-tools
          path: |
            build/compute-test/
            build/compute-batch/
